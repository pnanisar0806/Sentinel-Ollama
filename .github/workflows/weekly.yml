name: weekly-report
on:
  schedule:
    # 04:30 UTC = 10:00 IST, Sunday (weekly deep report, PRD 12.2).
    # Owner signed off on the Saturday 08:00 -> Sunday 10:00 move on 2026-09-13.
    - cron: '30 4 * * 0'
    # Retries, because GitHub treats `schedule` as best-effort and DROPS runs under
    # load rather than merely delaying them — the 2026-09-20 04:30 slot never fired,
    # and on a weekly cron one dropped slot loses the whole week. `pnpm report` is a
    # no-op once a report has been delivered for the business date (it checks the
    # `weekly_report` audit row), so a retry that lands after a successful run costs
    # one job and writes nothing.
    - cron: '30 7 * * 0'
    - cron: '30 11 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here - package.json's packageManager is the single source
      # of truth. Specifying both makes the action fail with "Multiple versions
      # of pnpm specified", which would break every workflow at setup.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          # Optional. Absent or blank => no narration / no satellite scoring, stated in
          # the report rather than guessed (an unset secret interpolates to '').
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          WEEKLY_LLM_MODEL: ${{ vars.WEEKLY_LLM_MODEL }}
          GSEC_YIELD_PCT: ${{ vars.GSEC_YIELD_PCT }}
      # The weekly job writes dashboard.html to docs/
      # Upload it as a Pages artifact
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-dashboard:
    needs: weekly
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4