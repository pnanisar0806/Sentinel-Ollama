name: weekly-report
on:
  schedule:
    # 02:30 UTC = 08:00 IST, Saturday (weekly deep report)
    # GitHub Actions cron is best-effort — expect a few minutes of slip.
    - cron: '30 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here - package.json's packageManager is the single source
      # of truth. Specifying both makes the action fail with "Multiple versions
      # of pnpm specified", which would break every workflow at setup.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm weekly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      # The weekly job writes dashboard.html to docs/
      # Upload it as a Pages artifact
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-dashboard:
    needs: weekly
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4