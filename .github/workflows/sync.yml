name: sync
on:
  schedule:
    # Daily, not Mon-Fri. With a weekday-only sync the Monday 03:15 digest read
    # Friday's data - 63.25h against a 36h freshness limit - so one digest in five
    # was a guaranteed false staleness alarm. The band is right; the schedule was wrong.
    # 19:00 IST = 13:30 UTC. NSE's whole-market file lands only after ~18:00 IST,
    # so this runs AFTER publication - an earlier run would 404 it and prices_eod
    # would stay empty/stale every day.
    - cron: '30 13 * * *'
  workflow_dispatch:

# INDmoney rotates its refresh token on every use. Two overlapping runs (a slow scheduled
# run and a manual one, or a retry) would each spend the same token and leave one of them
# holding a dead login. Runs queue instead of overlapping (open list #31, 2026-11-12).
concurrency:
  group: indmoney-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No `version:` here - package.json's packageManager is the single source
        # of truth. Specifying both makes the action fail with "Multiple versions
        # of pnpm specified", which would break every workflow at setup.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          # Classifies new material filings. Absent => events stay pending, never neutral.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
