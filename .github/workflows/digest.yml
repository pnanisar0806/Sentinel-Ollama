name: digest
on:
  schedule:
    # 15:30 UTC = 21:00 IST, every day (owner's chosen evening slot).
    # GitHub Actions cron is best-effort — expect a few minutes of slip.
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here - package.json's packageManager is the single source
      # of truth. Specifying both makes the action fail with "Multiple versions
      # of pnpm specified", which would break every workflow at setup.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}