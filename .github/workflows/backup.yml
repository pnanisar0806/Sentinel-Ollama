name: Weekly backup

on:
  # The weekly schedule is OFF by owner decision (2026-09-24: "backup not needed").
  # It failed every week on missing BACKUP_REPO / GH_TOKEN, which is noise that hides
  # real failures. Manual dispatch is kept, so re-enabling is restoring the cron below:
  #   schedule:
  #     - cron: '30 5 * * 0'   # Sunday 11:00 IST
  # Note the backup is of DATA (audit log, approvals, lots, vests), not of .env.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
      BACKUP_BRANCH: ${{ secrets.BACKUP_BRANCH }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx --env-file-if-exists=.env src/jobs/backup.ts